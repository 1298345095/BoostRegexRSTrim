name: Temporary dependency and formatting check
on:
  push:
    branches:
      - refactor/hex-serde-json-windows-sys-20261024
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Regenerate Cargo.lock and expose exact content
        shell: bash
        run: |
          cargo generate-lockfile
          echo '__CARGO_LOCK_BEGIN__'
          cat Cargo.lock
          echo '__CARGO_LOCK_END__'
      - name: Check formatting and expose diff
        shell: bash
        run: |
          cargo fmt --all
          git diff -- src/character.rs src/bin/regex_driver.rs
          git diff --exit-code -- src/character.rs src/bin/regex_driver.rs || true
      - name: Check build
        run: cargo check --all-targets --all-features
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Run strict clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
